# Hub models, pinned by commit sha. A branch name is not a pin: "main" moves and a
# moved revision silently invalidates every index built from it.
#
# Every sha here was resolved against the Hub and pasted in. Nothing resolves one at
# runtime, so a fresh clone cannot embed against whatever the Hub is serving today.

[embeddinggemma]
kind = "embedding"
repo_id = "google/embeddinggemma-300m"
revision = "57c266a740f537b4dc058e1b0cda161fd15afa75"
dim = 768
pooling = "mean"
normalized = true
# Asymmetric. Embedding the corpus with the query prefix degrades everything silently.
query_prompt = "task: search result | query: "
document_prompt = "title: none | text: "

[minilm]
kind = "reranker"
repo_id = "cross-encoder/ms-marco-MiniLM-L6-v2"
revision = "233902d25c440f23af6f7d6e94d2946bac0bee0a"

[bge-m3]
kind = "reranker"
repo_id = "BAAI/bge-reranker-v2-m3"
revision = "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"

# The chat model. Small enough to sit beside the embedder and the reranker on 24 GB,
# and its chat template renders tools, which the agent loop needs.
["qwen2.5-3b-instruct"]
kind = "chat"
repo_id = "Qwen/Qwen2.5-3B-Instruct"
revision = "aa8e72537993ba99e69dfaafa59ed015b17504d1"
