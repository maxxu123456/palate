# Seed for the cost_rates table. The table is the authority at pricing time, never this file,
# because two authorities disagreeing is how a cost number goes wrong.
#
# Everything here runs on this machine, so every rate is 0.00 USD, which is the truth and not
# a guess. Local cost is reported as seconds beside dollars rather than blended into a number
# nobody can defend.
#
# A model of "*" matches every model that provider serves.

[[rate]]
provider = "transformers"
model = "*"
input_per_mtok = 0.0
output_per_mtok = 0.0

[[rate]]
provider = "sentence_transformers"
model = "*"
input_per_mtok = 0.0
output_per_mtok = 0.0

[[rate]]
provider = "fake"
model = "*"
input_per_mtok = 0.0
output_per_mtok = 0.0
